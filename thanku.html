<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Application form Submitted</title>
        <link rel="icon" href="images/Yumora Logo.png" type="image/png">
        <link rel="stylesheet" href="styles5.css">
    </head>

    <body>
        <h1>Application form Submitted</h1>
        <p>We have received your application and will review it shortly.</p>

        <p id="summary">Received application form</p>
        <p><a href="Careers.html"><button class="apply-btn">Go back to Careers</button></a>
         
        <script>
            const data = new URLSearchParams(window.location.search);

            const name = data.get("custname") || "there";
            const email = data.get("custemail") || "not provided";
            const phone = data.get("custphone") || "not provided";
            const jobType = data.get("q1") || "not specified";
            const position = data.get("q2") || "not specified";
            const experience = data.get("q3") || "not provided";
            const certificate = data.get("q4") || "not specified";
            const duration = data.get("q5") || "not provided";
            const commit = data.get("q6") || "not specified";

            const box = document.getElementById("summary");

            if (data.toString() === "") {
                box.textContent = "Tip: Submit your application form to see it here.";
            }
                else {
                    box.innerHTML = `
                    <p>Thanks for applying, ${name}! </p>

                    <ul>
                        <li><strong>Email:</strong> ${email}</li>
                        <li><strong>Phone:</strong> ${phone}</li>
                        <li><strong>Job Type:</strong> ${jobType}</li>
                        <li><strong>Position:</strong> ${position}</li>
                        <li><strong>Experience:</strong> ${experience}</li>
                        <li><strong>Food & Hygiene Certificate:</strong> ${certificate}</li>
                        <li><strong>Availability (duration):</strong> ${duration}</li>
                        <li><strong>Can commit to requirement:</strong> ${commit}</li>
                    </ul>   
                `;        
                }
        </script>
    </body>
</html>
